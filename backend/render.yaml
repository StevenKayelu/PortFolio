# LEGACY: the API is moving to the MotoGo server (see deploy/DEPLOY.md).
# Render keeps running the pre-move code as a fallback, with auto-deploy OFF.
# This file targets the old MySQL setup and should be removed after the move.
services:
  - type: web
    name: portfolio-platform-api
    env: node
    plan: starter
    # seed-ecosystem.js only creates missing brand rows; it never overwrites admin edits.
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && node prisma/seed-ecosystem.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CLIENT_URLS
        sync: false
      - key: LEAD_IP_SALT
        generateValue: true
      - key: ADMIN_URL
        value: https://stevenkayelu.online
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: R2_PRIVATE_BUCKET
        sync: false
